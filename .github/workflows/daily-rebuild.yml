# 毎朝の再ビルド（毎朝の再ビルド便・2026-11-04／予備便・2026-11-10）
#
# 日付で表示が変わるのにビルド／ISR の時点で固まるページ（/subsidies の「公募中・本日締切」は revalidate 1 日、
# 静的ページのお知らせバナーの HTML など）を、毎朝 00:10 JST に Vercel の deploy hook で作り直す。
# microCMS には触らない（ビルドの prebuild が通常の push と同じだけ読むだけ）。
#
# - 再ビルド: 毎日 00:10 JST（UTC 15:10）と手動実行（workflow_dispatch）。どちらも印を見ずに必ず hook を叩く。
#   secret VERCEL_DEPLOY_HOOK_URL が無いときは何もせず成功で終わる。
# - 予備: 02:10・04:10・06:10・09:10 JST（UTC 17:10・19:10・21:10・00:10）。00:10 の実行が始まらなかった日に備える
#   （2026-11-10 に実例: 00:10 の分が始まらず、/subsidies が約 8 時間 前日の見え方だった）。
#   本番のビルドの日付の印 https://bess-net.jp/build-info.json（src/app/build-info.json/route.ts・ビルド時に決まる静的な JSON）の
#   dateJst を見て決める。
#     dateJst が今日（JST）→ 今日の日付でビルド済みなので何もしない（成功で終わる）。
#     dateJst が前の日付 → hook を叩く。
#     印が読めない（HTTP が 200 でない・JSON でない・dateJst が無い・時間切れ）→ 06:10 の回だけ叩く
#     （印がずっと読めなくても、余計なビルドは 1 日 1 本まで）。
#   00:10 の実行が大きく遅れて予備と重なると、ビルドが 2 本走ることがある（害は無い）。
# - 手動実行の入力 check_only（既定 false）: true なら予備と同じ判定の 1 行を出すだけで叩かない（予備の経路の試し用）。
# - IndexNow の後段: 毎日 01:00 JST（UTC 16:00）。リポジトリ変数 INDEXNOW_DAILY が "on" のときだけ動く（既定は止めておく）。
#   本番の sitemap の lastmod が前日 00:00 JST 以降の URL を scripts/indexnow-submit.ts --since で送る。
#   生成時刻の lastmod と変電所の詳細は道具の側で外れる。送る URL が 0 件なら送らない。
# - Actions の一覧には 1 日に 6 本並ぶ（再ビルド 1・予備 4・IndexNow 1）。予備で何もしなかった回も「成功」になる。
# - 止め方: Actions の画面でこのワークフローを Disable する（再ビルドも予備も IndexNow も止まる）。IndexNow だけ止めるときは INDEXNOW_DAILY を on 以外にする。
# ★deploy hook の URL は秘密（.env と同じ扱い）。ログに出さない（set -x を使わない・curl の応答は state だけ表示する）。
# ★run の中に ${{ }} を書かない（値は env で渡す）。判定の手順はローカルで env を差し替えて試せる形にしてある。

name: daily-rebuild

on:
  schedule:
    - cron: '10 15 * * *' # 00:10 JST 再ビルド（必ず叩く）
    - cron: '10 17 * * *' # 02:10 JST 予備 1（印を見て決める）
    - cron: '10 19 * * *' # 04:10 JST 予備 2（印を見て決める）
    - cron: '10 21 * * *' # 06:10 JST 予備 3（印を見て決める・印が読めないときは叩く）
    - cron: '10 0 * * *' # 09:10 JST 予備 4（印を見て決める）
    - cron: '0 16 * * *' # 01:00 JST IndexNow の後段（INDEXNOW_DAILY=on のときだけ）
  workflow_dispatch:
    inputs:
      check_only:
        description: 'true なら印を見て判定の 1 行を出すだけ（hook は叩かない）。false は今までどおり必ず叩く'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-rebuild-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule != '0 16 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 叩くかを決める（予備の時刻と check_only はビルドの日付の印を見る）
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHECK_ONLY: ${{ inputs.check_only }}
          MARKER_URL: https://bess-net.jp/build-info.json
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          # 00:10 の定時と手動実行（check_only でない）は、印を見ずに必ず叩く（今までどおり）
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "10 15 * * *" ]; then
            echo "判定: 今日 $today・00:10 の定時なので印を見ずに叩く"
            echo "fire=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CHECK_ONLY" != "true" ]; then
            echo "判定: 今日 $today・手動実行なので印を見ずに叩く"
            echo "fire=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            '10 17 * * *') slot='02:10' ;;
            '10 19 * * *') slot='04:10' ;;
            '10 21 * * *') slot='06:10' ;;
            '10 0 * * *') slot='09:10' ;;
            *) slot='手動（check_only）' ;;
          esac
          # 印を読む（HTTP の番号と本文）。時間切れ・接続できないときの番号は 000
          code=$(curl -s --max-time 20 -o marker.json -w '%{http_code}' "$MARKER_URL") || true
          code=${code:-000}
          mark=""
          if [ "$code" = "200" ]; then
            mark=$(node -e 'try{const d=JSON.parse(require("fs").readFileSync("marker.json","utf8"));const v=d&&d.dateJst;process.stdout.write(typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:"")}catch(e){}' 2>/dev/null) || mark=""
          fi
          if [ -z "$mark" ]; then
            if [ "$slot" = "06:10" ]; then
              fire=true; why="印が読めないので、06:10 の回として叩く"
            else
              fire=false; why="印が読めないので、この回は何もしない"
            fi
          elif [ "$mark" = "$today" ]; then
            fire=false; why="今日の日付でビルド済み。何もしない"
          elif [[ "$mark" < "$today" ]]; then
            fire=true; why="前の日付のビルドなので叩く"
          else
            fire=false; why="印が今日より後の日付（時計のずれ）。何もしない"
          fi
          if [ "$CHECK_ONLY" = "true" ] && [ "$fire" = "true" ]; then
            fire=false; why="$why（check_only なので叩かない）"
          fi
          echo "判定: 今日 $today・枠 $slot・印 HTTP $code・dateJst ${mark:-（読めない）} → $why（hook: $([ "$fire" = true ] && echo 叩く || echo 叩かない)）"
          echo "fire=$fire" >> "$GITHUB_OUTPUT"

      - name: Vercel の deploy hook に POST する
        if: steps.decide.outputs.fire == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "secret VERCEL_DEPLOY_HOOK_URL が無いので何もしない"
            exit 0
          fi
          code=$(curl -sS --max-time 30 -o resp.json -w '%{http_code}' -X POST "$HOOK") || true
          state=$(jq -r '.job.state // "?"' resp.json 2>/dev/null || echo "?")
          echo "deploy hook: HTTP $code・job.state $state（$(TZ=Asia/Tokyo date '+%F %T') JST）"
          case "$code" in 2??) ;; *) exit 1 ;; esac

  indexnow:
    if: github.event.schedule == '0 16 * * *' && vars.INDEXNOW_DAILY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 前日 00:00 JST 以降に変わった URL を IndexNow に送る
        run: |
          since=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          echo "--since $since"
          npx --yes tsx@4.21.0 scripts/indexnow-submit.ts --since "$since" --apply
